<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400">
<defs>
  <linearGradient id="tb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
</defs>
<style>
  text{font:16.5px Consolas,'Courier New',monospace}
  .pr{fill:#4ade80;font-weight:700} .pa{fill:#60a5fa;font-weight:700} .mu{fill:#6b7280} .cm{fill:#f3f4f6}
  .ot{fill:#c4c9d6} .ar{fill:#f472b6}
  .ln{opacity:0;animation:in .35s ease-out forwards} @keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
