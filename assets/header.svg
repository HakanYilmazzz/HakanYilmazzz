  .ft{font:500 15px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#7d87ad;letter-spacing:3px;opacity:0;animation:up 1s 1.4s ease-out forwards}
  @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  .ring{transform-origin:600px 220px;animation:sp 40s linear infinite} @keyframes sp{to{transform:rotate(360deg)}}
  .scan{animation:sc 6s linear infinite} @keyframes sc{from{transform:translateY(-60px)}to{transform:translateY(440px)}}
</style>
