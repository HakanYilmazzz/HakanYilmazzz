name: Update WakaTime card

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/wakatime_card.py
      - .github/workflows/wakatime.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Render card
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python3 .github/scripts/wakatime_card.py assets/wakatime.svg
      - name: Commit card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/wakatime.svg
          git diff --cached --quiet || (git commit -m "Update WakaTime card" && git pull --rebase && git push)
