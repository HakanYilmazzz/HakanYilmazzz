name: Update stats card

on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/stats_card.py
      - .github/workflows/stats.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Render card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 .github/scripts/stats_card.py assets/stats.svg
      - name: Commit card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet || (git commit -m "Update stats card" && git pull --rebase && git push)
